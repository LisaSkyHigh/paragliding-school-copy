# Kept in sync with `.github/workflows/deploy-github-pages.yml` (deploy from GitHub Actions).

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-paragliding-school-copy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Remove routes incompatible with static export
        run: rm -rf "app/(studio)" "app/preview"

      - name: Build static site
        env:
          STATIC_GH_PAGES: "1"
          NEXT_PUBLIC_BASE_PATH: "/paragliding-school-copy"
          NEXT_PUBLIC_SITE_URL: https://lisaskyhigh.github.io/paragliding-school-copy
        run: npm run build

      - name: Disable Jekyll (so _next CSS/JS is served)
        run: touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
